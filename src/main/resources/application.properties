spring.application.name=java-ml-inference-engine
server.port=8082
# Java 21 virtual threads for every request thread.
spring.threads.virtual.enabled=true
# Max in-flight single-predict inference calls (semaphore in InferenceService).
inference.max-inflight=256
# Max transactions accepted in one batch request.
inference.max-batch-size=1000
# Optional remote model endpoint. When unset, the local logistic model scores everything.
# inference.model.endpoint=
# inference.model.api-key=
